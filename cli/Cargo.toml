[package]
name = "k-dot"
version = "0.0.2"
edition = "2024"
description = "Cross-platform CLI manager for Kachitaro Dotfiles"

[[bin]]
name = "dot"
path = "src/main.rs"


[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
owo-colors = "4.1"
dirs = "5.0"
anyhow = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
