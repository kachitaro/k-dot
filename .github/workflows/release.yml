name: Release

on:
  # Merge PR vào release cũng tạo ra sự kiện push, nên không cần trigger pull_request
  # (trước đây có cả hai khiến mỗi lần merge chạy release hai lần song song).
  push:
    branches:
      - "release"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.1 or leave empty to auto-bump patch)"
        required: false
        default: ""

permissions:
  contents: write

# Mỗi lần chỉ chạy một release, lần sau xếp hàng chờ chứ không huỷ lần đang chạy
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci.yml

  prepare-version:
    name: Prepare Release Version
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Release Version
        id: get_version
        run: |
          tag_exists() { git rev-parse -q --verify "refs/tags/v$1" >/dev/null; }

          # 1. Đọc version hiện tại từ cli/Cargo.toml
          CURRENT_VER=$(grep -m1 '^version = ' cli/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "Current Cargo.toml version: $CURRENT_VER"

          INPUT_VER="${{ github.event.inputs.version }}"

          if [ -n "$INPUT_VER" ]; then
            # Nếu người dùng nhập thủ công qua workflow_dispatch
            CLEAN_VER="${INPUT_VER#v}"
            if tag_exists "$CLEAN_VER"; then
              echo "::error::Tag v$CLEAN_VER đã tồn tại, không ghi đè bản phát hành cũ."
              exit 1
            fi
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            # Nếu kích hoạt bằng push tag
            CLEAN_VER="${GITHUB_REF_NAME#v}"
          else
            # Kích hoạt khi push vào nhánh release: tăng patch cho tới khi gặp tag chưa tồn tại
            # (Cargo.toml trên release có thể cũ hơn tag mới nhất nếu quên sync version về).
            CLEAN_VER="$CURRENT_VER"
            while tag_exists "$CLEAN_VER"; do
              IFS='.' read -r major minor patch <<< "$CLEAN_VER"
              CLEAN_VER="${major}.${minor}.$((patch + 1))"
            done
            if [ "$CLEAN_VER" != "$CURRENT_VER" ]; then
              echo "Auto-bumped patch version from $CURRENT_VER to $CLEAN_VER"
            fi
          fi

          TAG="v$CLEAN_VER"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Target Tag: $TAG, Version: $CLEAN_VER"

  build-release:
    name: Build (${{ matrix.target }})
    needs: [prepare-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: dot.exe
            archive_ext: zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: dot
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_name: dot
            archive_ext: tar.gz
            use_cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: dot
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: dot
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli
          key: ${{ matrix.target }}

      - name: Update Version in Cargo.toml & Cargo.lock
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          echo "Updating Cargo.toml version to $VERSION"
          sed -i.bak -E "s/^version = \".*\"/version = \"$VERSION\"/" cli/Cargo.toml && rm cli/Cargo.toml.bak
          # Chỉ cập nhật version của chính crate trong Cargo.lock, không đụng tới dependency
          cargo update --manifest-path cli/Cargo.toml --workspace
          head -n 10 cli/Cargo.toml
        shell: bash

      - name: Install Cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --locked --manifest-path cli/Cargo.toml --target ${{ matrix.target }}
          else
            cargo build --release --locked --manifest-path cli/Cargo.toml --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package Archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          ARCHIVE_NAME="dot-${{ matrix.target }}.tar.gz"
          cd cli/target/${{ matrix.target }}/release
          tar -czf "../../../../${ARCHIVE_NAME}" dot
        shell: bash

      - name: Package Archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $archiveName = "dot-${{ matrix.target }}.zip"
          Compress-Archive -Path "cli\target\${{ matrix.target }}\release\dot.exe" -DestinationPath $archiveName
        shell: pwsh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dot-${{ matrix.target }}
          path: dot-${{ matrix.target }}.${{ matrix.archive_ext }}

  publish-release:
    name: Publish GitHub Release
    needs: [prepare-version, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Flatten Artifacts
        run: |
          mkdir -p dist
          find release_artifacts -type f -exec cp {} dist/ \;
          ls -la dist/

      - name: Generate Checksums
        run: |
          cd dist
          for f in *; do
            if [ -f "$f" ]; then
              sha256sum "$f" > "${f}.sha256"
            fi
          done
          sha256sum dot-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag }}
          # Tag phải trỏ đúng commit vừa build; mặc định GitHub tạo tag ở HEAD của nhánh mặc định (main)
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.prepare-version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-version:
    name: Sync Version Back to ${{ matrix.branch }}
    needs: [prepare-version, publish-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [main, develop]
    steps:
      - name: Checkout ${{ matrix.branch }} branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0

      - name: Update Cargo.toml & Cargo.lock on ${{ matrix.branch }}
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          BRANCH="${{ matrix.branch }}"
          echo "Updating cli/Cargo.toml on $BRANCH to version $VERSION"
          sed -i -E "s/^version = \".*\"/version = \"$VERSION\"/" cli/Cargo.toml
          cargo update --manifest-path cli/Cargo.toml --workspace

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet cli/Cargo.toml cli/Cargo.lock; then
            git add cli/Cargo.toml cli/Cargo.lock
            git commit -m "chore(release): bump version to $VERSION [skip ci]"
            git push origin "$BRANCH"
            echo "Successfully updated version to $VERSION on $BRANCH branch!"
          else
            echo "Version on $BRANCH is already up to date."
          fi
