name: CI

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - "cli/**"
      - "**.ps1"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main", "develop", "release" ]
    paths:
      - "cli/**"
      - "**.ps1"
      - ".github/workflows/**"
  # Cho phép release.yml gọi lại để test trước khi build bản phát hành
  workflow_call:

# github.workflow là tên workflow gọi tới (CI hoặc Release), nên hai bên không huỷ lẫn nhau
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Check
        run: cargo check --locked --manifest-path cli/Cargo.toml

      - name: Format Check
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --locked --manifest-path cli/Cargo.toml --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --locked --manifest-path cli/Cargo.toml

  powershell:
    name: PowerShell Syntax
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse all .ps1 files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -File -Filter *.ps1 | Where-Object FullName -notmatch '[\\/](target|\.git)[\\/]' | ForEach-Object {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
              foreach ($e in $errors) {
                  $failed = $true
                  Write-Host "::error file=$($_.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
          }
          if ($failed) { exit 1 }
          Write-Host "Tất cả file .ps1 đều hợp lệ."
