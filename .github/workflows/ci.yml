name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "cli/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "cli/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cli

      - name: Check
        run: cargo check --manifest-path cli/Cargo.toml

      - name: Format Check
        run: cargo fmt --manifest-path cli/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path cli/Cargo.toml --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --manifest-path cli/Cargo.toml
